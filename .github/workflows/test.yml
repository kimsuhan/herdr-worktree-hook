name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # test.sh needs git 2.54 or newer (hooks set in git config): the log shows what the runner has.
      - run: git --version && python3 --version
      - run: ./test.sh
